services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tend}
      POSTGRES_USER: ${POSTGRES_USER:-tend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tend}
    ports: ["5432:5432"]
    volumes: ["tend-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tend}
      POSTGRES_USER: ${POSTGRES_USER:-tend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tend}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploying}
      FRONTEND_ORIGIN: http://localhost:5173
      TEND_DEMO_MODE: "true"
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  tend-data:
